   # Senhas e IP ficam no arquivo .env (que não vai para o GitHub)

   services:
     livekit:
       image: livekit/livekit-server:v1.13.7
       restart: unless-stopped
       command: --dev --bind 0.0.0.0 --node-ip ${HOST_IP}
       environment:
         LIVEKIT_KEYS: "devkey: ${LIVEKIT_SECRET}"
       ports:
         - "7880:7880"
         - "7881:7881"
         - "7882:7882/udp"

     app:
       build: .
       restart: unless-stopped
       ports:
         - "3000:3000"
       environment:
         HOST: 0.0.0.0
         JWT_SECRET: ${JWT_SECRET}
         LIVEKIT_API_URL: http://livekit:7880
         LIVEKIT_PUBLIC_URL: ws://${HOST_IP}:7880
         LIVEKIT_API_KEY: devkey
         LIVEKIT_API_SECRET: ${LIVEKIT_SECRET}
         ADMIN_USERS: ${ADMIN_USERS:-}
         MECENAS: ${MECENAS:-}
         STEAM_API_KEY: ${STEAM_API_KEY:-}
         # endereço do Concord para quem está no Radmin: a Steam devolve o login para cá
         PUBLIC_URL: http://${HOST_IP}:3000
         # anexos: tamanho máximo em GB (vazio = sem limite) e quanto do disco sempre fica livre (padrão 5 GB)
         ATTACH_MAX_GB: ${ATTACH_MAX_GB:-}
         ATTACH_DISK_RESERVE_GB: ${ATTACH_DISK_RESERVE_GB:-5}
         # sala de cinema: filmes da pasta "videos" (ao lado deste arquivo) e quanto do upload eles podem usar (Mbps)
         CINEMA_DIR: /videos
         CINEMA_MAX_MBPS: ${CINEMA_MAX_MBPS:-70}
       volumes:
         - ./data-dev:/data
         - ./videos:/videos:ro
       depends_on:
         - livekit

     musicbot:
       build: ./musicbot
       restart: unless-stopped
       environment:
         CONCORD_URL: http://app:3000
         CONCORD_TOKEN: ${MUSICBOT_TOKEN}
         LIVEKIT_URL: ws://livekit:7880
         LIVEKIT_API_KEY: devkey
         LIVEKIT_API_SECRET: ${LIVEKIT_SECRET}
       depends_on:
         - app
         - livekit

     # bot de filmes: transmite os vídeos da pasta "videos" (ao lado deste arquivo). Veja moviebot/LEIA-ME.md
     moviebot:
       build: ./moviebot
       restart: unless-stopped
       environment:
         CONCORD_URL: http://app:3000
         CONCORD_TOKEN: ${MOVIEBOT_TOKEN:-}
         LIVEKIT_URL: ws://livekit:7880
         LIVEKIT_API_KEY: devkey
         LIVEKIT_API_SECRET: ${LIVEKIT_SECRET}
         DEFAULT_QUALITY: ${MOVIEBOT_QUALITY:-1080p30}
         MAX_BITRATE_KBPS: ${MOVIEBOT_MAX_KBPS:-8000}
       volumes:
         - ./videos:/videos:ro
       depends_on:
         - app
         - livekit
